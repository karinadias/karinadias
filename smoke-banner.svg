<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-label="Fumaça vermelha se movendo em uma interface tech">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#090509"/>
      <stop offset="0.5" stop-color="#1b0a12"/>
      <stop offset="1" stop-color="#090509"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" x2="1">
      <stop offset="0" stop-color="#6f1528" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#b33b50" stop-opacity=".68"/>
      <stop offset="0.55" stop-color="#e27a83" stop-opacity=".35"/>
      <stop offset="0.8" stop-color="#8f2038" stop-opacity=".65"/>
      <stop offset="1" stop-color="#6f1528" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#d36a78" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#grid)"/>
  <g opacity=".7" filter="url(#blur)">
    <path fill="none" stroke="url(#smoke)" stroke-width="34" stroke-linecap="round" d="M-80 285 C180 170 260 330 470 245 S790 175 1010 260 S1320 330 1680 195">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M-80 285 C180 170 260 330 470 245 S790 175 1010 260 S1320 330 1680 195;M-80 260 C180 320 300 145 500 250 S790 315 1030 215 S1370 155 1680 245;M-80 285 C180 170 260 330 470 245 S790 175 1010 260 S1320 330 1680 195"/>
    </path>
  </g>
  <path fill="none" stroke="url(#smoke)" stroke-width="4" stroke-linecap="round" d="M-80 285 C180 170 260 330 470 245 S790 175 1010 260 S1320 330 1680 195">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M-80 285 C180 170 260 330 470 245 S790 175 1010 260 S1320 330 1680 195;M-80 260 C180 320 300 145 500 250 S790 315 1030 215 S1370 155 1680 245;M-80 285 C180 170 260 330 470 245 S790 175 1010 260 S1320 330 1680 195"/>
  </path>
  <g fill="#f0a2a2">
    <circle cx="280" cy="220" r="2"><animate attributeName="cy" values="220;204;220" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1190" cy="250" r="2"><animate attributeName="cy" values="250;266;250" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="180" r="1.5"><animate attributeName="cy" values="180;170;180" dur="4s" repeatCount="indefinite"/></circle>
